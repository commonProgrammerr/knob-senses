; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; UM ENV POR MODELO. O que e' comum aos tres vive no [env] (herdado); o que e'
; de um modelo so' (flags, libs, quais arquivos entram no build) fica no env
; dele - nada se mistura.
;
;   pio run -e rf        Random Forest        (lib/knob-senses-rf)
;   pio run -e mlp       MLP / Edge Impulse   (lib/knob-senses)
;   pio run -e knn       k-NN (emlearn)       (lib/knob-senses-knn)
;
; O build compila SO' o modelo do env: o main.cpp escolhe o include pelo -DMODEL_*
; daqui, e build_src_filter/lib_ignore tiram os outros dois glues e as outras
; duas libs. Upload/monitor/debug valem para os tres.
; =============================================================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Configuração de Memória (N16R8 - QIO Flash / OPI PSRAM) -------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Gravação e Debug ---------------------------------------------------
; ATENÇÃO: 'esp-builtin' NÃO serve como protocolo de upload nesta ligação.
; Ele usa o USB-JTAG interno do ESP32-S3, que só existe na porta "USB"
; nativa (VID 303A:1001). O cabo está na porta "UART", que passa pelo
; bridge CH343 (VID 1A86:55D3) - por isso o OpenOCD falhava com
; "esp_usb_jtag: could not find or open device!".
;
; Pela porta UART, grava-se com esptool normalmente:
upload_protocol = esptool

; Portas fixadas para o PlatformIO não pegar o Bluetooth (COM3/COM4) por
; engano. Se trocar o cabo de porta USB o número pode mudar - confira com:
;   pio device list
upload_port = COM28
monitor_port = COM28
upload_speed = 460800

; --- Debug --------------------------------------------------------------
; COM OS DOIS CABOS CONECTADOS, upload, monitor e debug convivem:
;
;   porta "UART" -> CH343 -> COM28 : upload (esptool) e monitor serial
;   porta "USB"  -> nativo -> COM29 : JTAG, usado pelo debug
;
; O monitor sai pela UART0 (o que Serial significa sem ARDUINO_USB_CDC_ON_BOOT),
; que é fisicamente ligada à CH343 - por isso monitor_port = COM28 e nenhuma
; flag de CDC é necessária. O JTAG não usa porta COM: o OpenOCD acha o
; dispositivo por VID:PID 303A:1001.
;
; NÃO mova o monitor para um adaptador externo: com os dois cabos ele já
; funciona pela UART, em paralelo com o debug.
debug_tool = esp-builtin

; Parar em setup() e não em main(): em Arduino o ponto de entrada do sketch é
; setup(), então isso evita ter que atravessar o runtime do core a cada sessão.
debug_init_break = tbreak setup

; --- Build (comum) --------------------------------------------------------
; O default LDF mode (chain) resolve includes por library *name*, which never
; matches a path-shaped include like "edge-impulse-sdk/classifier/...".
; deep+ resolves includes by which library actually contains the file.
lib_ldf_mode = deep+

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1

; -DARDUINO_USB_CDC_ON_BOOT=1 foi removido de propósito: com ele, 'Serial'
; passa a ser o USB CDC da porta nativa e o monitor na UART (COM28) fica
; mudo - e o harness em src/main.cpp usa Serial.print() o tempo todo.
; Sem ele, 'Serial' volta a ser a UART0, que é o que o CH343 expõe.
;
; Se um dia ligar o cabo na porta "USB" nativa, reative esta flag e aponte
; monitor_port para a porta que aparecer.
lib_deps =
	https://github.com/eModbus/eModbus

; --- Random Forest --------------------------------------------------------
[env:rf]
extends = env
build_flags = ${env.build_flags} -DMODEL_RF
build_src_filter = +<*> -<mlp_model.cpp> -<knn_model.cpp>
lib_ignore = knob-senses, knob-senses-knn

; --- MLP (Edge Impulse) ---------------------------------------------------
; O SDK e o modelo sao UMA lib do PlatformIO, lib/knob-senses, no layout dos
; exports de Arduino do Edge Impulse:
;
;   lib/knob-senses/src/edge-impulse-sdk/
;   lib/knob-senses/src/model-parameters/
;   lib/knob-senses/src/tflite-model/
;
; Re-exportar o modelo = descompactar por cima de lib/knob-senses/src/ - sem
; mudanca de configuracao (as flags abaixo continuam valendo):
;
; - EI_PORTING_ESPRESSIF=0: o SDK traz uma camada de porting por plataforma
;   (arduino, espressif, mbed...) e escolhe por defines; duas podem parecer
;   ativas ao mesmo tempo e definir os mesmos ei_* em dobro, entao a escolha e'
;   pinada. O arduino e' o certo (nao precisa de nada alem da API do Arduino) e
;   o ESPRESSIF=0 tambem evita o EI forcar ARDUINO=0 mais adiante.
;   Este impulso e' um EON de 2.7 KB - nao perde nada por nao pegar os kernels
;   ESP-NN acelerados.
;
; - O export novo do Edge Impulse (fev/2025+) embute o .tflite via asm
;   ".incbin" (lib/knob-senses/src/tflite-model/tflite_learn_*.h), com caminho
;   relativo ao src/ da lib. O -I que o PlatformIO passa chega so' ao
;   pre-processador: o driver do gcc NAO encaminha -I ao assembler, e o as
;   morre com "file not found: tflite-model/....tflite". O -Wa,-I entrega a
;   MESMA pasta direto ao assembler (medido: sem ele o build falha; com ele
;   compila).
;   Alternativa sem flag: no dashboard do Edge Impulse, Experiments > "Use xxd
;   instead of INCBIN to link TFLite/ONNX files" e re-exportar (volta ao array
;   de bytes, que o compilador resolve sozinho).
[env:mlp]
extends = env
build_flags = ${env.build_flags} -DMODEL_MLP -DEI_PORTING_ESPRESSIF=0 -Wa,-I,lib/knob-senses/src
build_src_filter = +<*> -<rf_model.cpp> -<knn_model.cpp>
lib_ignore = knob-senses-rf, knob-senses-knn

; --- k-NN (emlearn) -------------------------------------------------------
; Sem flags proprias: a lib e' gerada pelo utils/treino_knn.ipynb e se
; autoexplica (headers vendorizados planos no src/ da lib). O unico custo
; notavel e' a RAM do scratch do emlearn (8 B por prototipo), documentado no
; README da lib.
[env:knn]
extends = env
build_flags = ${env.build_flags} -DMODEL_KNN
build_src_filter = +<*> -<rf_model.cpp> -<mlp_model.cpp>
lib_ignore = knob-senses, knob-senses-rf
