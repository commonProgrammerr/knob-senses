; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Configuração de Memória (N16R8 - QIO Flash / OPI PSRAM) -------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Gravação e Debug ---------------------------------------------------
; ATENÇÃO: 'esp-builtin' NÃO serve como protocolo de upload nesta ligação.
; Ele usa o USB-JTAG interno do ESP32-S3, que só existe na porta "USB"
; nativa (VID 303A:1001). O cabo está na porta "UART", que passa pelo
; bridge CH343 (VID 1A86:55D3) - por isso o OpenOCD falhava com
; "esp_usb_jtag: could not find or open device!".
;
; Pela porta UART, grava-se com esptool normalmente:
upload_protocol = esptool

; Portas fixadas para o PlatformIO não pegar o Bluetooth (COM3/COM4) por
; engano. Se trocar o cabo de porta USB o número pode mudar - confira com:
;   pio device list
upload_port = COM28
monitor_port = COM28
upload_speed = 460800

; --- Debug --------------------------------------------------------------
; COM OS DOIS CABOS CONECTADOS, upload, monitor e debug convivem:
;
;   porta "UART" -> CH343 -> COM28 : upload (esptool) e monitor serial
;   porta "USB"  -> nativo -> COM29 : JTAG, usado pelo debug
;
; O monitor sai pela UART0 (o que Serial significa sem ARDUINO_USB_CDC_ON_BOOT),
; que é fisicamente ligada à CH343 - por isso monitor_port = COM28 e nenhuma
; flag de CDC é necessária. O JTAG não usa porta COM: o OpenOCD acha o
; dispositivo por VID:PID 303A:1001.
;
; NÃO mova o monitor para um adaptador externo: com os dois cabos ele já
; funciona pela UART, em paralelo com o debug.
debug_tool = esp-builtin

; Parar em setup() e não em main(): em Arduino o ponto de entrada do sketch é
; setup(), então isso evita ter que atravessar o runtime do core a cada sessão.
debug_init_break = tbreak setup

; --- Edge Impulse & Build Flags ----------------------------------------
; The SDK and the model are one PlatformIO library, lib/knob-senses, laid out
; the way Edge Impulse's own Arduino exports are:
;
;   lib/knob-senses/src/edge-impulse-sdk/
;   lib/knob-senses/src/model-parameters/
;   lib/knob-senses/src/tflite-model/
;
; PlatformIO puts that src/ on the include path, which is what lets the EI
; headers resolve each other's root-relative includes
; (e.g. "model-parameters/model_variables.h"). Re-exporting the model from
; Edge Impulse Studio means unzipping over lib/knob-senses/src/ - no config
; changes needed.
;
; The default LDF mode (chain) resolves includes by library *name*, which never
; matches a path-shaped include like "edge-impulse-sdk/classifier/...".
; deep+ resolves includes by which library actually contains the file.
lib_ldf_mode = deep+

; The EI SDK ships a porting layer per platform (arduino, espressif, mbed,
; zephyr, posix...) and picks one by sniffing preprocessor defines. Two of them
; can look enabled at once and define the same ei_* symbols twice, so the
; choice is pinned here instead of left to auto-detection. The arduino layer is
; selected because it needs nothing beyond the Arduino API; setting ESPRESSIF=0
; also stops EI from forcing ARDUINO=0 further down its header.
;
; Nothing here needs the ESP-NN accelerated kernels - this impulse is a
; 2.7 KB EON graph - so nothing is lost by not taking the espressif path.
build_flags =
	-DEI_PORTING_ESPRESSIF=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1

; -DARDUINO_USB_CDC_ON_BOOT=1 foi removido de propósito: com ele, 'Serial'
; passa a ser o USB CDC da porta nativa e o monitor na UART (COM28) fica
; mudo - e o harness em src/main.cpp usa Serial.print() o tempo todo.
; Sem ele, 'Serial' volta a ser a UART0, que é o que o CH343 expõe.
;
; Se um dia ligar o cabo na porta "USB" nativa, reative esta flag e aponte
; monitor_port para a porta que aparecer.
lib_deps =
	https://github.com/eModbus/eModbus