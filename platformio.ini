; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; UM ENV POR MODELO. O que é comum a todos vive no [env] (herdado); o que é
; de um modelo só (flags, libs, quais arquivos entram no build) fica no env
; dele - nada se mistura.
;
;   pio run -e rf          Random Forest                (lib/knob-senses-rf)
;   pio run -e mlp-ei      MLP via SDK do Edge Impulse  (lib/knob-senses)
;   pio run -e mlp-tflite  MLP via TFLite Micro externo (lib/knob-mlp-tflite)
;
; O build compila SÓ o modelo do env: o main.cpp escolhe o include pelo
; -DMODEL_* daqui, e build_src_filter/lib_ignore tiram os outros glues e as
; outras libs. Upload/monitor/debug valem para todos.
; =============================================================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Configuração de Memória (N16R8 - QIO Flash / OPI PSRAM) -------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Gravação e Debug ---------------------------------------------------
; ATENÇÃO: 'esp-builtin' NÃO serve como protocolo de upload nesta ligação.
; Ele usa o USB-JTAG interno do ESP32-S3, que só existe na porta "USB"
; nativa (VID 303A:1001). O cabo está na porta "UART", que passa pelo
; bridge CH343 (VID 1A86:55D3) - por isso o OpenOCD falhava com
; "esp_usb_jtag: could not find or open device!".
;
; Pela porta UART, grava-se com esptool normalmente:
upload_protocol = esptool

; Portas fixadas para o PlatformIO não pegar o Bluetooth (COM3/COM4) por
; engano. Se trocar o cabo de porta USB o número pode mudar - confira com:
;   pio device list
upload_port = COM28
monitor_port = COM28
upload_speed = 460800
monitor_filters = 
	time
	log2file

lib_deps=
	https://github.com/espressif/esp-tflite-micro
	https://github.com/espressif/esp-nn

; --- Debug --------------------------------------------------------------
; COM OS DOIS CABOS CONECTADOS, upload, monitor e debug convivem:
;
;   porta "UART" -> CH343 -> COM28 : upload (esptool) e monitor serial
;   porta "USB"  -> nativo -> COM29 : JTAG, usado pelo debug
;
; O monitor sai pela UART0 (o que Serial significa sem ARDUINO_USB_CDC_ON_BOOT),
; que é fisicamente ligada à CH343 - por isso monitor_port = COM28 e nenhuma
; flag de CDC é necessária. O JTAG não usa porta COM: o OpenOCD acha o
; dispositivo por VID:PID 303A:1001.
;
; NÃO mova o monitor para um adaptador externo: com os dois cabos ele já
; funciona pela UART, em paralelo com o debug.
debug_tool = esp-builtin

; Parar em setup() e não em main(): em Arduino o ponto de entrada do sketch é
; setup(), então isso evita ter que atravessar o runtime do core a cada sessão.
debug_init_break = tbreak setup

; --- Build (comum) --------------------------------------------------------
; O modo LDF padrão (chain) resolve includes pelo nome da biblioteca e não acha
; um include em forma de caminho, como "edge-impulse-sdk/classifier/..."; o
; deep+ resolve também pelo arquivo, na biblioteca que de fato o contém.
lib_ldf_mode = deep+

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1

; --- Random Forest --------------------------------------------------------
; extra_scripts: pre-build que roda utils/gerar_lib_rf.py SÓ quando o joblib
; da granularidade embarcada muda (assinatura mtime+tamanho, carimbo em
; .pio/prebuild/rf.json). Sem mudança, a lib fica como está e o build segue.
; KNOB_SKIP_PREBUILD=1 dispensa a checagem e usa a lib existente.
[env:rf]
extends = env
build_flags = ${env.build_flags} -DMODEL_RF
build_src_filter = +<*> -<mlp_model.cpp> -<mlp_model_tflite.cpp>
lib_ignore = knob-senses, knob-mlp-tflite
extra_scripts = pre:scripts/pre_build.py
; granularidade embarcada do RF: "5min" | "10min" | "1h" | "1D"
; (contract.GRANULARIDADES) - precisa existir dist/random_forest_<freq>.joblib
custom_rf_freq = 1h

; --- MLP (Edge Impulse) ---------------------------------------------------
; Mantido para comparação; as análises usam o env mlp-tflite.
;
; O SDK e o modelo são UMA lib do PlatformIO, lib/knob-senses, no layout dos
; exports de Arduino do Edge Impulse:
;
;   lib/knob-senses/src/edge-impulse-sdk/
;   lib/knob-senses/src/model-parameters/
;   lib/knob-senses/src/tflite-model/
;
; Re-exportar o modelo = descompactar por cima de lib/knob-senses/src/ - sem
; mudança de configuração (as flags abaixo continuam valendo):
;
; - EI_PORTING_ESPRESSIF=1: o SDK traz uma camada de porting por plataforma
;   (arduino, espressif, mbed...) e escolhe por defines. A escolha fica pinada
;   para não depender da detecção automática do alvo; com =1 vale a camada da
;   Espressif, em porting/espressif/. As funções das camadas são weak, então
;   duas cópias não colidem no link.
;   Os kernels do ESP-NN entram à parte: ei_classifier_config.h os habilita
;   automaticamente quando o alvo é ESP32, sem depender desta flag.
;
; - KNOB_MLP_DEBUG imprime na UART as primeiras 8 linhas do caminho de
;   inferência (bruto, normalizado, q de entrada, Box-Cox e kW), para comparar
;   com o PC.
;
; - O export novo do Edge Impulse (fev/2025+) embute o .tflite via asm
;   ".incbin" (lib/knob-senses/src/tflite-model/tflite_learn_*.h), com caminho
;   relativo ao src/ da lib. O -I que o PlatformIO passa chega só ao
;   pré-processador: o driver do gcc NÃO encaminha -I ao assembler, e o link
;   morre com "file not found: tflite-model/....tflite". O -Wa,-I entrega a
;   MESMA pasta direto ao assembler (medido: sem ele o build falha; com ele
;   compila).
;   Alternativa sem flag: no dashboard do Edge Impulse, Experiments > "Use xxd
;   instead of INCBIN to link TFLite/ONNX files" e re-exportar (volta ao array
;   de bytes, que o compilador resolve sozinho).
[env:mlp-ei]
extends = env
build_flags = ${env.build_flags} -DMODEL_MLP -DEI_PORTING_ESPRESSIF=1 -DKNOB_MLP_DEBUG -Wa,-I,lib/knob-senses/src
build_src_filter = +<*> -<rf_model.cpp> -<mlp_model_tflite.cpp>
lib_ignore = knob-senses-rf, knob-mlp-tflite
; pre-build: roda utils/exportar_mlp_ei.py SÓ quando o modelo, os dados
; representativos, a granularidade ou a quantization mudam (carimbo em
; .pio/prebuild/mlp-ei.json). Como o script fala com o Studio, use
; KNOB_SKIP_PREBUILD=1 para compilar sem rede.
extra_scripts = pre:scripts/pre_build.py
; granularidade embarcada do MLP: "5min" | "10min" | "1h" | "1D"
; (contract.GRANULARIDADES) - precisa existir dist/<freq>/modelo.tflite
custom_mlp_freq = 1h
; quantization do modelo: "int8" | "float32"
custom_mlp_quantization = float32

; --- MLP TFLite Micro externo ---------------------------------------------
; Caminho usado nas análises: o .tflite de dist/<freq>/ é embutido como vetor
; de bytes em lib/knob-mlp-tflite/ (model_data.cc), sem a lib do Edge Impulse.
; O runtime é o esp-tflite-micro e o esp-nn, clonados em tools/ com
; library.json próprio - por isso lib_extra_dirs = tools.
; Exige C++17 por causa do micro_common.h do componente.
;
; -DKNOB_TFLITE_MICRO_EXTERNAL escolhe o include do schema e a chamada de
; AllocateTensors() do esp-tflite-micro em lib/knob-mlp-tflite/src/.
; -DKNOB_MLP_DEBUG tem o mesmo efeito do env mlp-ei.
[env:mlp-tflite]
extends = env
build_flags = ${env.build_flags}
	-DMODEL_MLP_TFLITE -DKNOB_TFLITE_MICRO_EXTERNAL
	-DKNOB_MLP_DEBUG -std=gnu++17
	-DCONFIG_IDF_TARGET_ESP32S3=1
	-DESP_NN
	-I.pio/libdeps/mlp-tflite/esp-tflite-micro
	-I.pio/libdeps/mlp-tflite/esp-tflite-micro/third_party/flatbuffers/include
	-I.pio/libdeps/mlp-tflite/esp-tflite-micro/third_party/kissfft
	-I.pio/libdeps/mlp-tflite/esp-nn/include
	-I.pio/libdeps/mlp-tflite/esp-nn/src/common

build_unflags = -std=gnu++11
build_src_filter = 
	+<*> 
	-<rf_model.cpp> 
	-<mlp_model.cpp>
	-<esp-tflite-micro/**/examples/*>
	-<esp-tflite-micro/**/tests/*>
lib_ignore = knob-senses-rf, knob-senses
; pre-build: roda utils/generate_model_data_mlp.py SÓ quando o modelo, os dados
; representativos, a granularidade ou a quantization mudam (carimbo em
; .pio/prebuild/mlp-tflite.json). Não usa rede.
extra_scripts = pre:scripts/pre_build.py
; granularidade embarcada do MLP: "5min" | "10min" | "1h" | "1D"
; (contract.GRANULARIDADES) - precisa existir dist/<freq>/modelo.tflite
custom_mlp_freq = 1h
; quantization do modelo: "int8" | "float32" | "dynamic" | "float16"
; (dynamic e float16 saem de dist/<freq>/quantizations/, gerados por
; utils/evaluate_quantizations_mlp.py)
custom_mlp_quantization = int8
