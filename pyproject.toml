[project]
name = "knob-sense-models"
version = "0.1.0"
description = "Contrato, dados, metricas e os modelos (RF, k-NN e MLP) do knob-senses."
readme = "README.md"
authors = [
    { name = "André Escorel", email = "gustavo.escorel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "emlearn",
]

[project.optional-dependencies]
# O que os notebooks precisam ALEM do que os modulos importam (graficos, prep, execucao).
# Instalado pela primeira celula dos notebooks: pip install -e ".[notebooks]".
notebooks = [
    "matplotlib",
    "statsmodels",
    "scipy",
    "nbconvert",
    "ipython",
    "ipykernel"
]
# O MLP (Keras) e' extra: o .venv de dados roda Python 3.14, sem wheel de TensorFlow.
# Use num ambiente Python <= 3.13. O Keras >= 3.8 e' o minimo para
# Model.export(input_signature=..., verbose=...).
mlp = [
    "tensorflow>=2.18",
    "keras>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Uma distribuicao, quatro modulos top-level. O uv_build nao suporta mais de um modulo
# (ele exige src/<nome_do_projeto>/__init__.py), por isso o backend e' hatchling.
packages = ["models/src/common", "models/src/rf", "models/src/knn", "models/src/mlp"]
