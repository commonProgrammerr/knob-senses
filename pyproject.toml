[project]
name = "knob-sense-models"
version = "0.1.0"
description = "Contrato, dados, metricas e os modelos (RF e MLP) do knob-senses."
readme = "README.md"
authors = [
    { name = "André Escorel", email = "gustavo.escorel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "emlearn",
    # emlearn 0.23.2 importa distutils, removido do Python >= 3.12; o setuptools
    # instala o shim que mantem `import distutils` funcionando.
    "setuptools",
    # notebooks
    "matplotlib",
    "statsmodels",
    "scipy",
    "nbconvert",
    "ipython",
    "ipykernel",
    "tensorflow",
    "keras",
]

[project.optional-dependencies]
cuda = [
    "tensorflow[and-cuda]",
    # "nvidia-cublas-cu12",
    # "nvidia-cuda-cupti-cu12",
    # "nvidia-cuda-nvcc-cu12",
    # "nvidia-cuda-runtime-cu12",
    # "nvidia-cudnn-cu12",
    # "nvidia-cufft-cu12",
    # "nvidia-curand-cu12",
    # "nvidia-cusolver-cu12",
    # "nvidia-cusparse-cu12",
    # "nvidia-nccl-cu12",
    # "nvidia-nvjitlink-cu12",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Uma distribuicao, tres modulos top-level. O uv_build nao suporta mais de um modulo
# (ele exige src/<nome_do_projeto>/__init__.py), por isso o backend e' hatchling.
packages = ["models/src/common", "models/src/rf", "models/src/mlp"]
